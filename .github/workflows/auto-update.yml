name: Auto-Update Deals & Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest deals & structure specs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: node scripts/auto-update.mjs

      - name: Commit updated product catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/products.json)" ]; then
            git add data/products.json
            git commit -m "chore: automated deal & price update"
            git push
          fi

      - name: Build static site
        run: node scripts/build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
