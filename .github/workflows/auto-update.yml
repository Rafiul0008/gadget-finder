name: Auto-Update Deals & Deploy to GitHub Pages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run full automation sync (phones, prices, images, deals, daily news, build)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: node scripts/sync-all.mjs

      - name: Commit updated data and media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/ src/assets/)" ]; then
            git add data/ src/assets/
            git commit -m "chore: automated phones, prices, deals & daily news sync"
            git push
          fi

      - name: Compress dist images to WebP (quality 85, full resolution)
        run: |
          sudo apt-get update && sudo apt-get install -y webp
          node scripts/compress-images.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=best-phone-under

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
